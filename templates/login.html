<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - ระบบเช็คชื่อนักเรียน</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Sarabun:wght@300;400;500&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='images/person_check.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</head>

<body>
    <div class="login-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 d-flex justify-content-center">

                    <div class="login-card">
                        <div class="text-center mb-3">
                            <div class="d-inline-block mb-2"
                                style="background: #f0f5ff; padding: 12px 20px; border-radius: 50%; box-shadow: 0 8px 20px rgba(106, 156, 255, 0.12);">
                                <i class="bi bi-person-check-fill" style="font-size: 3rem; color: #6a9cff;"></i>
                            </div>

                            <h2 class="login-title fs-4 mb-1">Attendance System</h2>
                            <p class="text-muted fw-semibold" style="font-size: 0.9rem;">ระบบเช็คชื่อนักเรียน</p>
                        </div>

                        <form action="{{ url_for('auth.login') }}" method="POST">
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <div class="form-group-custom">
                                <label class="form-label-custom">ชื่อผู้ใช้งาน</label>
                                <input type="text" name="username" class="form-control-custom"
                                    placeholder="รหัสประจำตัวหรืออีเมล" required>
                            </div>

                            <div class="form-group-custom">
                                <label class="form-label-custom">รหัสผ่าน</label>
                                <div style="position: relative;">
                                    <input type="password" name="password" id="password" class="form-control-custom"
                                        placeholder="รหัสผ่าน" required>
                                    <i class="bi bi-eye-slash" id="togglePassword"
                                        style="position: absolute; right: 20px; top: 50%; transform: translateY(-50%); cursor: pointer; color: #666; font-size: 1.2rem;"></i>
                                </div>
                            </div>

                            <button type="submit" class="btn-login-custom mt-2">
                                เข้าสู่ระบบใช้งาน <i class="bi bi-box-arrow-in-right ms-1"></i>
                            </button>

                            <div class="position-relative my-4 text-center">
                                <hr class="text-muted" style="opacity: 0.15;">
                                <span
                                    class="position-absolute top-50 start-50 translate-middle px-3 text-muted small fw-medium">
                                    หรือเข้าสู่ระบบด้วย
                                </span>
                            </div>

                            <a href="{{ url_for('auth.google_login') }}"
                                class="btn border w-100 py-25 rounded-3 d-flex align-items-center justify-content-center gap-2 fw-semibold shadow-sm transition-all btn-google-custom"
                                style="background-color: #fff; color: #444; border-color: #e4e4e4 !important; font-size: 0.95rem; text-decoration: none; transition: 0.2s;">
                                <img src="{{ url_for('static', filename='images/google-icon.svg') }}">
                                Sign in with Google
                            </a>

                        </form>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            console.log("Login Page Ready!");

            const alertFn = window.showDashboardAlert || window.showAlert;
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            {
                const flashCategory = {{ category | tojson }};
                const flashMessage = {{ message | tojson }};

                console.log("Flash detected:", flashCategory, flashMessage);

                if (flashMessage === 'Login_Success') {
                    const welcomeMessage = 'ยินดีต้อนรับผู้ดูแลระบบ Admin Dashboard';

                    // บังคับใช้ showAlert สำหรับกรณีเข้าสู่ระบบสำเร็จ
                    if (typeof window.showAlert === "function") {
                        window.showAlert('success', welcomeMessage);
                    } else if (window.Swal) {
                        Swal.fire({
                            icon: 'success',
                            title: 'เข้าสู่ระบบสำเร็จ!',
                            text: welcomeMessage,
                            confirmButtonText: 'ตกลง',
                            confirmButtonColor: '#4f46e5',
                            customClass: {
                                popup: 'rounded-4 shadow-lg border-0'
                            }
                        });
                    } else {
                        alert(welcomeMessage);
                    }
                } else if (typeof alertFn === "function") {
                    alertFn(flashCategory, flashMessage);
                } else {
                    alert(flashMessage);
                }
            }
            {% endfor %}
            {% endif %}
            {% endwith %}

            inputs.forEach(input => {
                input.addEventListener('input', function () {
                    this.classList.remove('input-error');
                });
            });

            const submitBtn = document.querySelector('.btn-login-custom');
            let timeLeft = parseInt("{{ remaining_time | default(0) }}");

            if (timeLeft > 0 && submitBtn) {
                submitBtn.disabled = true;
                submitBtn.style.backgroundColor = '#94a3b8';
                submitBtn.style.cursor = 'not-allowed';

                const countdownTimer = setInterval(() => {
                    submitBtn.innerHTML = `ล็อคชั่วคราว... รอ ${timeLeft} วิ <i class="bi bi-lock-fill ms-1"></i>`;
                    timeLeft--;

                    if (timeLeft < 0) {
                        clearInterval(countdownTimer);
                        submitBtn.disabled = false;
                        submitBtn.style.backgroundColor = '';
                        submitBtn.style.cursor = 'pointer';
                        submitBtn.innerHTML = `เข้าสู่ระบบใช้งาน <i class="bi bi-box-arrow-in-right ms-1"></i>`;

                        document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
                    }
                }, 1000);

                submitBtn.innerHTML = `<i class="bi bi-lock-fill ms-1"></i> ล็อคชั่วคราว... รอ ${timeLeft} วิ`;
            }
        });
    </script>

</body>

</html>
